name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets

      - name: Test
        run: cargo test

      - name: Build release
        run: cargo build --release

      - name: Package without model
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/diffract.exe dist/
          Copy-Item README.md dist/
          Copy-Item diffract.toml dist/
          Copy-Item diffract.toml.example dist/
          Compress-Archive -Path dist/* -DestinationPath diffract-windows-x64.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: diffract-windows-x64
          path: diffract-windows-x64.zip

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: diffract-windows-x64

      - uses: softprops/action-gh-release@v2
        with:
          files: diffract-windows-x64.zip
