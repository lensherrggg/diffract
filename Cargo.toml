[package]
name = "diffract"
version = "0.2.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
jieba-rs = "0.11.0"
log = { version = "0.4.34", features = ["std"] }
ort = "2.0.0-rc.15"
quick-xml = "0.42.0"
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
serde = { version = "1.0.229", features = ["derive"] }
similar = "3.2.0"
tokenizers = { version = "0.23.2", default-features = false, features = ["onig"] }
toml = "1.1.8"
unicode-normalization = "0.1.26"
unicode-width = "0.2.2"
ureq = "3.5.0"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
